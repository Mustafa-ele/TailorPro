<!-- orders/templates/orders/orders.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Orders — TailorPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .voice-buttons {
      margin-top: 5px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">TailorPro</a>
  </div>
</nav>

<div class="container my-4">

  <div class="d-flex justify-content-between mb-3">
    <h3>Create Order</h3>

    <form class="d-flex" method="get">
      <input name="q" value="{{ q }}" class="form-control me-2" placeholder="Search orders or customer">
      <button class="btn btn-outline-secondary">Search</button>
    </form>
  </div>

  <!-- Order Form -->
  <div class="card mb-4 p-4 shadow">
    <form method="post">
      {% csrf_token %}

      <h5 class="mb-3">Customer Details</h5>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Customer Name</label>
          <input id="customer" name="customer" class="form-control">
          <div class="voice-buttons">
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('customer')">🎤 Speak</button>
            <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Phone</label>
          <input id="phone" name="phone" class="form-control">
          <div class="voice-buttons">
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('phone')">🎤 Speak</button>
            <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
          </div>
        </div>
      </div>

      <hr>

      <h5 class="mb-3">Order Details</h5>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Cloth Type</label>
          <input id="cloth_type" name="cloth_type" class="form-control">
          <div class="voice-buttons">
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('cloth_type')">🎤 Speak</button>
            <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
          </div>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Quantity</label>
          <input id="qty" name="qty" class="form-control">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Delivery Date</label>
          <input type="date" id="delivery_date" name="delivery_date" class="form-control">
        </div>
      </div>

      <hr>

     <h5 class="mb-3">Measurements</h5>

<div class="row">

  <!-- Length -->
  <div class="col-md-4 mb-3">
    <label class="form-label">Length</label>
    <input id="length" name="length" class="form-control">
    <div class="voice-buttons">
      <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('length')">🎤 Speak</button>
      <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
    </div>
  </div>

  <!-- Chest -->
  <div class="col-md-4 mb-3">
    <label class="form-label">Chest</label>
    <input id="chest" name="chest" class="form-control">
    <div class="voice-buttons">
      <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('chest')">🎤 Speak</button>
      <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
    </div>
  </div>

  <!-- Shoulder -->
  <div class="col-md-4 mb-3">
    <label class="form-label">Shoulder</label>
    <input id="shoulder" name="shoulder" class="form-control">
    <div class="voice-buttons">
      <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('shoulder')">🎤 Speak</button>
      <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
    </div>
  </div>

  <!-- Sleeve -->
  <div class="col-md-4 mb-3">
    <label class="form-label">Sleeve</label>
    <input id="sleeve" name="sleeve" class="form-control">
    <div class="voice-buttons">
      <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('sleeve')">🎤 Speak</button>
      <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
    </div>
  </div>

  <!-- Waist -->
  <div class="col-md-4 mb-3">
    <label class="form-label">Waist</label>
    <input id="waist" name="waist" class="form-control">
    <div class="voice-buttons">
      <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('waist')">🎤 Speak</button>
      <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
    </div>
  </div>

  <!-- Hip -->
  <div class="col-md-4 mb-3">
    <label class="form-label">Hip</label>
    <input id="hip" name="hip" class="form-control">
    <div class="voice-buttons">
      <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('hip')">🎤 Speak</button>
      <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
    </div>
  </div>

  <!-- Neck -->
  <div class="col-md-4 mb-3">
    <label class="form-label">Neck</label>
    <input id="neck" name="neck" class="form-control">
    <div class="voice-buttons">
      <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('neck')">🎤 Speak</button>
      <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
    </div>
  </div>

</div>


      <hr>

      <h5 class="mb-3">Notes</h5>
      <textarea id="notes" name="notes" class="form-control" rows="3"></textarea>
      <div class="voice-buttons">
        <button type="button" class="btn btn-outline-primary btn-sm" onclick="startDictation('notes')">🎤 Speak</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="stopDictation()">⛔ Stop</button>
      </div>

      <br>

      <button class="btn btn-success px-4" type="submit">Save Order</button>
    </form>
  </div>

  <!-- Orders Table -->
  <table class="table table-striped shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>Order</th>
        <th>Customer</th>
        <th>Cloth</th>
        <th>Delivery</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for o in orders %}
      <tr>
        <td><a href="/orders/{{ o.id }}/">{{ o.order_number }}</a></td>
        <td>{{ o.customer.name }}</td>
        <td>{{ o.cloth_type }}</td>
        <td>{{ o.delivery_date }}</td>
        <td>{{ o.status }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="5" class="text-center">No orders yet</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>


<!-- Voice Script -->
<script>
let recognition = null;
let activeField = null;

function startDictation(fieldId) {
    activeField = fieldId;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Speech Recognition not supported!");
        return;
    }

    if (recognition) {
        recognition.stop();
        recognition = null;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.interimResults = true;
    recognition.continuous = true;

    recognition.onresult = function(event) {
        let txt = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            txt += event.results[i][0].transcript;
        }
        document.getElementById(activeField).value = txt;
    };

    recognition.onend = function() {
        if (recognition) {
            recognition.start();
        }
    };

    recognition.start();
}

function stopDictation() {
    if (recognition) {
        recognition.onend = null;
        recognition.stop();
        recognition = null;
    }
    activeField = null;
}
</script>

</body>
</html>
